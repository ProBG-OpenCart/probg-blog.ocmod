name: Add link titles for ProBG Blog 1.6.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-link-titles-1.6.1.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/link-title-attributes
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply link title patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/tmp_add_link_titles_1_6_1.py > /tmp/add_link_titles.py
          python3 /tmp/add_link_titles.py

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          find upload -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.6.1") { exit(1); }'
          grep -F "module_probg_blog_version') !== '1.6.1'" upload/admin/controller/extension/module/probg_blog.php
          grep -F "version'] = '1.6.1';" upload/admin/controller/extension/module/probg_blog.php
          grep -F "stage'] = '29';" upload/admin/controller/extension/module/probg_blog.php
          grep -F "module_probg_blog_version'] = '1.6.1'" upload/admin/model/extension/module/probg_blog.php
          grep -F '**Current version:** `1.6.1`' README.md
          grep -F '## [1.6.1]' CHANGELOG.md

      - name: Commit feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.xml README.md CHANGELOG.md docs upload
          git commit -m 'fix: add title attributes to all module links (1.6.1)'
          git push origin HEAD:feat/link-title-attributes

      - name: Remove one-off files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/add-link-titles-1.6.1.yml .github/tmp_add_link_titles_1_6_1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-off link title files'
          git push origin main
