name: Build ProBG Blog 1.0.6 dist

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  build-dist:
    if: github.head_ref == 'chore/build-dist-1.0.6-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          find upload -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.0.6") exit(1);'

      - name: Build OCMOD package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/probg-blog-1.0.6.ocmod.zip
          zip -qr dist/probg-blog-1.0.6.ocmod.zip install.xml upload
          unzip -t dist/probg-blog-1.0.6.ocmod.zip
          test "$(unzip -Z1 dist/probg-blog-1.0.6.ocmod.zip | head -n 1)" = "install.xml"
          unzip -Z1 dist/probg-blog-1.0.6.ocmod.zip | grep -q '^upload/'
          sha256sum dist/*.ocmod.zip | sed 's#  dist/#  #' > dist/SHA256SUMS

      - name: Commit package to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Veselin Totev'
          git config user.email 'v.totev@probg.com'
          git add dist/probg-blog-1.0.6.ocmod.zip dist/SHA256SUMS
          git commit -m 'build: add ProBG Blog 1.0.6 installation package'
          git push origin HEAD:main

      - name: Remove one-off workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup-main origin/main
          git rm .github/workflows/build-probg-blog-1.0.6-dist.yml
          git commit -m 'chore: remove one-off 1.0.6 dist workflow'
          git push origin HEAD:main
