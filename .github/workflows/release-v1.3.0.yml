name: Release ProBG Blog v1.3.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.3.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate 1.3.0 source
        run: |
          set -e
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.3.0") { fwrite(STDERR, "install.xml version mismatch\n"); exit(1); }'
          find upload -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          test -f upload/catalog/view/javascript/probg_blog_menu_slider.js
          test -f upload/catalog/view/theme/default/stylesheet/probg_blog_menu_slider.css
          grep -q 'private function ensureModuleInstances' upload/admin/controller/extension/module/probg_blog.php
          grep -q "probg_blog_type.*menu" upload/catalog/controller/extension/module/probg_blog.php
          grep -q "probg_blog_type.*articles" upload/catalog/controller/extension/module/probg_blog.php

      - name: Build installation package
        run: |
          set -e
          mkdir -p dist
          rm -f dist/probg-blog-1.3.0.ocmod.zip
          zip -qr dist/probg-blog-1.3.0.ocmod.zip install.xml upload
          unzip -t dist/probg-blog-1.3.0.ocmod.zip
          (
            cd dist
            sha256sum probg-blog-*.ocmod.zip | sort -k2 > SHA256SUMS
          )

      - name: Commit distribution package
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/probg-blog-1.3.0.ocmod.zip dist/SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m 'build: add ProBG Blog 1.3.0 installation package'
            git push origin HEAD:main
          fi

      - name: Create v1.3.0 tag
        run: |
          set -e
          if git rev-parse v1.3.0 >/dev/null 2>&1; then
            echo 'Tag v1.3.0 already exists' >&2
            exit 1
          fi
          git tag -a v1.3.0 -m 'ProBG Blog 1.3.0'
          git push origin v1.3.0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release create v1.3.0 \
            dist/probg-blog-1.3.0.ocmod.zip \
            dist/SHA256SUMS \
            --title 'ProBG Blog 1.3.0' \
            --notes-file docs/1.3.0.md \
            --verify-tag

      - name: Remove one-off workflow
        if: success()
        run: |
          set -e
          rm -f .github/workflows/release-v1.3.0.yml
          git add -A
          git commit -m 'chore: remove ProBG Blog 1.3.0 release workflow'
          git push origin HEAD:main
