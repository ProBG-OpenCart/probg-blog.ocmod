name: Apply ProBG Blog 1.3.0 feature

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'feat/1.3.0-multiple-menus-slider'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/1.3.0-multiple-menus-slider
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and run feature patch
        run: |
          git show origin/main:.github/workflows/feature-1.3.0-menus.yml > /tmp/source-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/source-workflow.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate source"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          body = text[start:end]
          lines = []
          in_triple = False
          for line in body.splitlines():
              quote_count = line.count("'''")
              if not in_triple and line.startswith('          '):
                  line = line[10:]
              lines.append(line)
              if quote_count % 2 == 1:
                  in_triple = not in_triple
          Path('/tmp/probg-blog-1.3.0.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/probg-blog-1.3.0.py

      - name: Validate source
        run: |
          set -e
          php -l upload/admin/controller/extension/module/probg_blog.php
          php -l upload/admin/model/extension/module/probg_blog.php
          php -l upload/catalog/controller/extension/module/probg_blog.php
          php -l upload/catalog/model/extension/probg_blog/blog.php
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.3.0") { exit(1); }'
          grep -q "private function syncMenuInstances" upload/admin/controller/extension/module/probg_blog.php
          grep -q "probg_blog_type.*menu" upload/catalog/controller/extension/module/probg_blog.php
          grep -q "data-probg-blog-slider" upload/catalog/view/theme/default/template/extension/module/probg_blog_menu.twig
          test -f upload/catalog/view/javascript/probg_blog_menu_slider.js
          test -f upload/catalog/view/theme/default/stylesheet/probg_blog_menu_slider.css

      - name: Commit feature
        run: |
          rm -f docs/.trigger-1.3.0*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add unlimited blog menus and article slider (1.3.0)'
          git push origin HEAD:feat/1.3.0-multiple-menus-slider
