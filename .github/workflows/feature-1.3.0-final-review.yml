name: Finalize ProBG Blog 1.3.0 compatibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/1.3.0-multiple-menus-slider'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/1.3.0-multiple-menus-slider
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply final review patch
        run: python3 tools/finalize_1_3_0.py

      - name: Validate compatibility
        run: |
          set -e
          php -l upload/admin/controller/extension/module/probg_blog.php
          php -l upload/catalog/controller/extension/module/probg_blog.php
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.3.0") exit(1);'
          grep -q "private function ensureModuleInstances" upload/admin/controller/extension/module/probg_blog.php
          grep -q "module_probg_blog_instances_migrated" upload/admin/controller/extension/module/probg_blog.php
          grep -q "probg_blog_type.*articles" upload/catalog/controller/extension/module/probg_blog.php
          grep -q "ProBG Blog - Latest Articles" upload/admin/controller/extension/module/probg_blog.php
          if grep -q 'name="module_probg_blog_layout_output"' upload/admin/view/template/extension/module/probg_blog.twig; then exit 1; fi
          test -f upload/catalog/view/javascript/probg_blog_menu_slider.js

      - name: Commit final review
        run: |
          rm -f tools/finalize_1_3_0.py
          rmdir tools 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve layout compatibility for multiple menus (1.3.0)'
          git push origin HEAD:feat/1.3.0-multiple-menus-slider
