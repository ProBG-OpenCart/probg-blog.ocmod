name: Build ProBG Blog 1.0.2 dist

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  build-dist:
    if: github.head_ref == 'chore/build-dist-1.0.2-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate source version
        shell: bash
        run: |
          set -euo pipefail
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.0.2") { fwrite(STDERR, "Expected ProBG Blog 1.0.2\n"); exit(1); }'
          find upload -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Build OCMOD package
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/probg-blog-1.0.2.ocmod.zip
          zip -rq dist/probg-blog-1.0.2.ocmod.zip install.xml upload
          unzip -t dist/probg-blog-1.0.2.ocmod.zip >/dev/null
          (cd dist && sha256sum probg-blog-*.ocmod.zip > SHA256SUMS)
          echo "Package size: $(wc -c < dist/probg-blog-1.0.2.ocmod.zip) bytes"
          sha256sum dist/probg-blog-1.0.2.ocmod.zip

      - name: Commit distribution package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Veselin Totev'
          git config user.email 'v.totev@probg.com'
          git add dist/probg-blog-1.0.2.ocmod.zip dist/SHA256SUMS
          git commit -m 'build: add ProBG Blog 1.0.2 installation package'
          git push origin HEAD:main

      - name: Remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/build-probg-blog-1.0.2-dist.yml
          git commit -m 'chore: remove one-off 1.0.2 dist workflow'
          git push origin HEAD:main
