name: Apply modern ProBG Blog article style

on:
  push:
    branches:
      - feat/1.7.0-modern-article-view
    paths:
      - '.github/workflows/apply-modern-article-style.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/1.7.0-modern-article-view
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire article stylesheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('upload/catalog/view/theme/default/stylesheet/probg_blog.css')
          text = path.read_text(encoding='utf-8')
          line = '@import url("probg_blog_article.css");\n\n'
          if not text.startswith(line):
              path.write_text(line + text, encoding='utf-8')
          PY

      - name: Validate article view
        shell: bash
        run: |
          set -euo pipefail
          test -f upload/catalog/view/theme/default/stylesheet/probg_blog_article.css
          head -n 1 upload/catalog/view/theme/default/stylesheet/probg_blog.css | grep -F '@import url("probg_blog_article.css");'
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('upload/catalog/view/theme/default/template/extension/module/probg_blog_article.twig')
          text = path.read_text(encoding='utf-8')
          anchors = re.findall(r'<a\b[^>]*>', text, re.S)
          missing = [tag for tag in anchors if not re.search(r'\btitle\s*=', tag)]
          if missing:
              raise SystemExit('Article links without title: ' + '\n'.join(missing))
          print('Validated article anchors:', len(anchors))
          PY

      - name: Commit stylesheet wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/catalog/view/theme/default/stylesheet/probg_blog.css
          if ! git diff --cached --quiet; then
            git commit -m 'feat: load modern article stylesheet'
            git push origin HEAD:feat/1.7.0-modern-article-view
          fi

      - name: Remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-modern-article-style.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-off article style workflow'
          git push origin HEAD:feat/1.7.0-modern-article-view
