name: Clean ProBG Blog 1.6.0 branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/clean-probg-blog-1.6.0-branch.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild clean feature branch
        run: |
          git fetch origin feat/1.6.0-list-display-category-nav
          git checkout -B feat/1.6.0-list-display-category-nav origin/main
          git checkout origin/feat/1.6.0-list-display-category-nav -- \
            CHANGELOG.md \
            README.md \
            docs/1.6.0.md \
            docs/STAGES.md \
            install.xml \
            upload/admin/controller/extension/module/probg_blog.php \
            upload/admin/language/bg-bg/extension/module/probg_blog.php \
            upload/admin/language/en-gb/extension/module/probg_blog.php \
            upload/admin/model/extension/module/probg_blog.php \
            upload/admin/view/template/extension/module/probg_blog.twig \
            upload/catalog/controller/extension/module/probg_blog.php \
            upload/catalog/view/theme/default/stylesheet/probg_blog.css \
            upload/catalog/view/theme/default/template/extension/module/probg_blog_category.twig \
            upload/catalog/view/theme/default/template/extension/module/probg_blog_list.twig
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md docs install.xml upload
          git commit -m 'feat: add configurable blog archive layouts (1.6.0)'
          git push --force origin HEAD:feat/1.6.0-list-display-category-nav

      - name: Remove one-off workflow
        run: |
          git checkout -B main origin/main
          git rm .github/workflows/clean-probg-blog-1.6.0-branch.yml
          git commit -m 'chore: remove one-off 1.6.0 branch cleanup workflow'
          git push origin main
