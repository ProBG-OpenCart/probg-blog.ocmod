name: Release ProBG Blog v1.6.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.6.0.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'chore: prepare v1.6.0 release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          grep -F '<version>1.6.0</version>' install.xml
          grep -F "module_probg_blog_version'] = '1.6.0'" upload/admin/controller/extension/module/probg_blog.php
          grep -F '**Current version:** `1.6.0`' README.md
          grep -F '## [1.6.0]' CHANGELOG.md

      - name: Validate PHP and XML
        shell: bash
        run: |
          set -euo pipefail
          find upload -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.6.0") { exit(1); }'

      - name: Build OpenCart installation package
        shell: bash
        run: |
          set -euo pipefail
          command -v zip >/dev/null
          rm -f dist/probg-blog-1.6.0.ocmod.zip
          zip -r -9 dist/probg-blog-1.6.0.ocmod.zip install.xml upload -x '*/.DS_Store'
          unzip -t dist/probg-blog-1.6.0.ocmod.zip

      - name: Update checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            for file in probg-blog-*.ocmod.zip; do
              sha256sum "$file"
            done
          ) > dist/SHA256SUMS
          grep -F 'probg-blog-1.6.0.ocmod.zip' dist/SHA256SUMS

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          awk 'BEGIN{p=0} /^## \[1\.6\.0\]/{p=1; next} /^## \[/{if(p) exit} p{print}' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md

      - name: Commit package to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-v1.6.0.yml
          git add dist/probg-blog-1.6.0.ocmod.zip dist/SHA256SUMS
          git commit -m 'release: add ProBG Blog v1.6.0 package'
          git push origin HEAD:main

      - name: Create tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.6.0 -m 'ProBG Blog v1.6.0'
          git push origin v1.6.0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.6.0 \
            dist/probg-blog-1.6.0.ocmod.zip \
            dist/SHA256SUMS \
            --repo ProBG-OpenCart/probg-blog.ocmod \
            --title 'ProBG Blog v1.6.0' \
            --notes-file /tmp/release-notes.md \
            --verify-tag
