name: Fix ProBG Blog 1.4.2 list cards

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-probg-blog-1.4.2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/1.4.2-list-cards
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python3 .github/scripts/apply-probg-blog-1.4.2.py

      - name: Validate
        run: |
          find upload -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.4.2") { exit(1); }'
          grep -q 'probg-blog-article-list-grid' upload/catalog/view/theme/default/template/extension/module/probg_blog_menu.twig
          grep -q 'probg-blog-article-card' upload/catalog/view/theme/default/template/extension/module/probg_blog_menu.twig
          grep -q 'probg-blog-article-list-grid' upload/catalog/view/theme/default/stylesheet/probg_blog_menu_slider.css

      - name: Commit feature branch
        run: |
          rm .github/scripts/apply-probg-blog-1.4.2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify list and slider article cards (1.4.2)'
          git push origin HEAD:fix/1.4.2-list-cards

      - name: Remove one-off workflow
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/fix-probg-blog-1.4.2.yml
          git commit -m 'chore: remove one-off 1.4.2 fix workflow'
          git push origin main
