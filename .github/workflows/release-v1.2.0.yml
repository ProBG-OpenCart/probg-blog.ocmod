name: Release ProBG Blog v1.2.0

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version and sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<version>1.2.0</version>' install.xml
          find upload -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x) { exit(1); }'

      - name: Build OCMOD package
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/probg-blog-1.2.0.ocmod.zip
          zip -qr dist/probg-blog-1.2.0.ocmod.zip install.xml upload
          unzip -t dist/probg-blog-1.2.0.ocmod.zip
          (cd dist && sha256sum probg-blog-*.ocmod.zip | sort -V > SHA256SUMS)

      - name: Commit dist and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ProBG Release Bot'
          git config user.email 'release@probg.com'
          git add dist/probg-blog-1.2.0.ocmod.zip dist/SHA256SUMS
          git rm .github/workflows/release-v1.2.0.yml
          git commit -m 'release: ProBG Blog v1.2.0'
          git push origin HEAD:main

      - name: Create annotated tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.2.0 -m 'ProBG Blog 1.2.0'
          git push origin v1.2.0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## Български

          **ProBG Blog 1.2.0** добавя lightbox преглед за допълнителните изображения в галерията на статиите.

          - Fancybox-подобен fullscreen overlay чрез вградения в OpenCart 3 Magnific Popup.
          - Предишно/следващо изображение и брояч текущо/общо.
          - Клавиатурна навигация: `Esc` и стрелки.
          - Responsive оформление за desktop и mobile.
          - Zoom индикатор върху thumbnails.
          - Без външен CDN или допълнителна библиотека.
          - Ако JavaScript компонентът не е наличен, оригиналните изображения продължават да се отварят като нормални линкове.

          След обновяване изпълнете **Extensions → Modifications → Refresh**.

          ## English

          **ProBG Blog 1.2.0** adds a lightbox viewer for additional article gallery images.

          - Fancybox-style fullscreen overlay using OpenCart 3's bundled Magnific Popup.
          - Previous/next navigation and current/total counter.
          - Keyboard navigation with `Esc` and arrow keys.
          - Responsive desktop and mobile presentation.
          - Zoom indicator on gallery thumbnails.
          - No external CDN or extra library dependency.
          - If the JavaScript component is unavailable, original image links continue to work normally.

          After updating, run **Extensions → Modifications → Refresh**.
          EOF
          gh release create v1.2.0 dist/probg-blog-1.2.0.ocmod.zip --title 'ProBG Blog 1.2.0' --notes-file /tmp/release-notes.md
