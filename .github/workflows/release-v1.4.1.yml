name: Release ProBG Blog v1.4.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'chore: add ProBG Blog 1.4.1 release workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate source
        run: |
          find upload -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.4.1") { fwrite(STDERR, "Expected install.xml version 1.4.1\n"); exit(1); }'

      - name: Build OCMOD package
        run: |
          mkdir -p dist
          rm -f dist/probg-blog-1.4.1.ocmod.zip
          zip -qr dist/probg-blog-1.4.1.ocmod.zip install.xml upload
          unzip -t dist/probg-blog-1.4.1.ocmod.zip
          test "$(unzip -Z1 dist/probg-blog-1.4.1.ocmod.zip | head -n1)" = "install.xml"
          unzip -Z1 dist/probg-blog-1.4.1.ocmod.zip | grep -q '^upload/'
          (cd dist && sha256sum probg-blog-*.ocmod.zip | sort -V -k2 > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Commit package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/probg-blog-1.4.1.ocmod.zip dist/SHA256SUMS
          git commit -m 'release: ProBG Blog 1.4.1'
          git push origin main

      - name: Create annotated tag
        run: |
          git tag -a v1.4.1 -m 'ProBG Blog 1.4.1'
          git push origin v1.4.1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.4.1 \
            dist/probg-blog-1.4.1.ocmod.zip \
            dist/SHA256SUMS \
            --title 'ProBG Blog 1.4.1' \
            --notes-file docs/1.4.1.md \
            --target main

      - name: Remove one-off workflow
        run: |
          git pull --ff-only origin main
          git rm .github/workflows/release-v1.4.1.yml
          git commit -m 'chore: remove one-off 1.4.1 release workflow'
          git push origin main
