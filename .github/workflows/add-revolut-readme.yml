name: Add Revolut README Button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    if: "${{ github.event.head_commit.message == 'chore add Revolut support button' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Revolut button
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          button = '[![Buy me a coffee](https://img.shields.io/badge/Buy%20me%20a%20coffee-Revolut-191C1F?logo=revolut&logoColor=white)](https://revolut.me/vtotev)'

          if 'https://revolut.me/vtotev' not in text:
              lines = text.splitlines()
              if lines and lines[0].startswith('# '):
                  lines.insert(1, '')
                  lines.insert(2, button)
                  lines.insert(3, '')
                  text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
              else:
                  text = button + '\n\n' + text
              path.write_text(text, encoding='utf-8')
          PY

          git config user.name 'Veselin Totev'
          git config user.email 'v.totev@probg.com'
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: add Buy me a coffee Revolut button'
          git push origin HEAD:main
