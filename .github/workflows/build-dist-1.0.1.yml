name: Build ProBG Blog 1.0.1 dist package

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-dist-1.0.1.yml

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<version>1.0.1</version>' install.xml

      - name: Build OCMOD package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/probg-blog-1.0.1.ocmod.zip
          zip -rq dist/probg-blog-1.0.1.ocmod.zip install.xml upload
          unzip -t dist/probg-blog-1.0.1.ocmod.zip
          zipinfo -1 dist/probg-blog-1.0.1.ocmod.zip | grep -qx 'install.xml'
          zipinfo -1 dist/probg-blog-1.0.1.ocmod.zip | grep -q '^upload/'
          if zipinfo -1 dist/probg-blog-1.0.1.ocmod.zip | grep -q '^probg-blog'; then
            echo 'Unexpected wrapper directory in package'
            exit 1
          fi

      - name: Update checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.ocmod.zip | sort -k2 > SHA256SUMS

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Veselin Totev'
          git config user.email 'v.totev@probg.com'
          git add dist/probg-blog-1.0.1.ocmod.zip dist/SHA256SUMS
          git rm .github/workflows/build-dist-1.0.1.yml
          git commit -m 'build: add ProBG Blog 1.0.1 installation package'
          git push origin HEAD:main
