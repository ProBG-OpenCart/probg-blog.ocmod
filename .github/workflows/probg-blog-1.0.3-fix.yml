name: ProBG Blog 1.0.3 Permission Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/1.0.3-admin-permission-proxy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/1.0.3-admin-permission-proxy
          fetch-depth: 0

      - name: Apply 1.0.3 fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'Expected at least {minimum} replacements in {path}, found {count}: {old}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              return count

          # Version metadata.
          replace_all('install.xml', '<version>1.0.2</version>', '<version>1.0.3</version>', 1)
          replace_all('upload/admin/controller/extension/module/probg_blog.php', "'1.0.2'", "'1.0.3'", 3)
          replace_all('upload/admin/controller/extension/module/probg_blog.php', "$data['stage'] = '14';", "$data['stage'] = '15';", 1)
          replace_all('upload/admin/model/extension/module/probg_blog.php', "'1.0.2'", "'1.0.3'", 1)

          # CRUD write checks use the single installable module permission.
          replace_all('upload/admin/controller/extension/probg_blog/category.php', "hasPermission('modify','extension/probg_blog/category')", "hasPermission('modify','extension/module/probg_blog')", 2)
          replace_all('upload/admin/controller/extension/probg_blog/article.php', "hasPermission('modify', 'extension/probg_blog/article')", "hasPermission('modify', 'extension/module/probg_blog')", 2)

          # Add a narrowly scoped startup permission proxy for internal read routes.
          install = Path('install.xml')
          text = install.read_text(encoding='utf-8')
          permission_patch = '''\n  <file path="admin/controller/startup/permission.php">\n    <operation error="skip">\n      <search><![CDATA[if (!$this->user->hasPermission('access', $route)) {]]></search>\n      <add position="before"><![CDATA[\n        if ((strpos($route, 'extension/probg_blog/category') === 0 || strpos($route, 'extension/probg_blog/article') === 0) && $this->user->hasPermission('access', 'extension/module/probg_blog')) {\n            return;\n        }\n      ]]></add>\n    </operation>\n  </file>\n'''
          if 'admin/controller/startup/permission.php' not in text:
              text = text.replace('\n</modification>', permission_patch + '\n</modification>', 1)
          install.write_text(text, encoding='utf-8')

          # Stage messages.
          bg = Path('upload/admin/language/bg-bg/extension/module/probg_blog.php')
          text = bg.read_text(encoding='utf-8')
          import re
          text = re.sub(r"\$_\['text_stage_info'\]='[^']*';", "$_['text_stage_info']='Версия 1.0.3 обединява правата за Категории и Статии с основното право за ProBG Blog и премахва зависимостта от отделни CRUD permissions.';", text, count=1)
          bg.write_text(text, encoding='utf-8')

          en = Path('upload/admin/language/en-gb/extension/module/probg_blog.php')
          text = en.read_text(encoding='utf-8')
          text = re.sub(r"\$_\['text_stage_info'\]='[^']*';", "$_['text_stage_info']='Version 1.0.3 consolidates Categories and Articles access under the main ProBG Blog permission and removes the dependency on separate CRUD permissions.';", text, count=1)
          en.write_text(text, encoding='utf-8')

          # Bilingual changelog.
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''## [1.0.3] - 2026-08-24\n\n### fix — Български\n\n- Коригиран е окончателно проблемът **„Разрешението е отказано“** за административните табове **Категории** и **Статии**.\n- Вътрешните routes `extension/probg_blog/category*` и `extension/probg_blog/article*` вече наследяват access само от `extension/module/probg_blog`.\n- Добавен е тесен OCMOD patch към `admin/controller/startup/permission.php`, който разрешава само blog CRUD routes и само ако текущата група вече има access до основния ProBG Blog модул.\n- Add/Edit/Delete проверките за категории и статии вече използват единственото `modify` право `extension/module/probg_blog`.\n- Отделни category/article permissions вече не са необходими за работа на административните табове.\n- Версията е обновена до `1.0.3`.\n\n### fix — English\n\n- Permanently fixed **Permission Denied** for the **Categories** and **Articles** administration tabs.\n- Internal `extension/probg_blog/category*` and `extension/probg_blog/article*` routes now inherit access exclusively from `extension/module/probg_blog`.\n- Added a narrowly scoped OCMOD patch to `admin/controller/startup/permission.php` that permits only the blog CRUD routes and only when the current group already has access to the main ProBG Blog module.\n- Category and article Add/Edit/Delete validation now uses the single `extension/module/probg_blog` modify permission.\n- Separate category/article permissions are no longer required for the administration tabs to work.\n- Updated the version to `1.0.3`.\n\n'''
          if '## [1.0.3]' not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(text, encoding='utf-8')

          # README release note.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('- Версия: `1.0.1`', '- Версия: `1.0.3`', 1)
          marker = '`ProBG Blog` е самостоятелен многоезичен блог модул за OpenCart 3 с категории, статии, SEO URL, Open Graph, JSON-LD, sitemap, кеширане, свързани продукти и вградено frontend меню.\n'
          section = '''\n## Промени във версия 1.0.3\n\n- Административните **Категории** и **Статии** вече използват основното access/modify право на ProBG Blog.\n- Не е необходимо ръчно добавяне на отделни permissions за `extension/probg_blog/category` и `extension/probg_blog/article`.\n- OCMOD permission proxy е ограничен единствено до вътрешните blog routes и не променя достъпа до други OpenCart страници.\n\n## Changes in version 1.0.3\n\n- Administration **Categories** and **Articles** now use the main ProBG Blog access/modify permission.\n- No manual permissions are required for `extension/probg_blog/category` or `extension/probg_blog/article`.\n- The OCMOD permission proxy is limited strictly to the internal blog routes and does not alter access to other OpenCart pages.\n'''
          if '## Промени във версия 1.0.3' not in text:
              text = text.replace(marker, marker + section, 1)
          readme.write_text(text, encoding='utf-8')

          stages = Path('docs/STAGES.md')
          text = stages.read_text(encoding='utf-8')
          line = '- 1.0.3 — consolidated Categories/Articles permissions under the main ProBG Blog access/modify permission.\n'
          if line not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += line
          stages.write_text(text, encoding='utf-8')

          doc = Path('docs/1.0.3.md')
          doc.write_text('''# ProBG Blog 1.0.3\n\n## Български\n\nВерсия 1.0.3 премахва зависимостта на табовете **Категории** и **Статии** от отделни OpenCart user-group permissions. Вътрешните blog routes наследяват access от основния `extension/module/probg_blog`, а всички операции за запис проверяват неговото `modify` право.\n\nСлед обновяване изпълнете **Extensions → Modifications → Refresh**. Не е необходимо ръчно добавяне на отделни category/article permissions.\n\n## English\n\nVersion 1.0.3 removes the dependency of the **Categories** and **Articles** tabs on separate OpenCart user-group permissions. Internal blog routes inherit access from the main `extension/module/probg_blog` permission, while all write operations validate its `modify` permission.\n\nAfter upgrading, run **Extensions → Modifications → Refresh**. No manual category/article permissions are required.\n''', encoding='utf-8')

          # Remove trigger/workflow from feature branch so the PR contains only real changes.
          Path('.trigger-1.0.3').unlink(missing_ok=True)
          Path('.github/workflows/probg-blog-1.0.3-fix.yml').unlink(missing_ok=True)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          find upload -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.0.3") exit(1);'
          grep -q 'admin/controller/startup/permission.php' install.xml
          grep -q "hasPermission('modify','extension/module/probg_blog')" upload/admin/controller/extension/probg_blog/category.php
          grep -q "hasPermission('modify', 'extension/module/probg_blog')" upload/admin/controller/extension/probg_blog/article.php
          ! grep -q "hasPermission('modify','extension/probg_blog/category')" upload/admin/controller/extension/probg_blog/category.php
          ! grep -q "hasPermission('modify', 'extension/probg_blog/article')" upload/admin/controller/extension/probg_blog/article.php

      - name: Commit feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Veselin Totev'
          git config user.email 'v.totev@probg.com'
          git add -A
          git commit -m 'fix: consolidate blog admin permissions (1.0.3)'
          git push origin HEAD:fix/1.0.3-admin-permission-proxy

      - name: Remove one-off workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup-main origin/main
          git rm .github/workflows/probg-blog-1.0.3-fix.yml
          git commit -m 'chore: remove one-off 1.0.3 workflow'
          git push origin HEAD:main
