name: Apply ProBG Blog 1.4.0 menu manager

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1.4.0-menu-manager-ui
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python3 tools/apply_1_4_0.py
      - name: Validate
        run: |
          set -e
          php -l upload/admin/controller/extension/module/probg_blog.php
          php -l upload/admin/model/extension/module/probg_blog.php
          php -l upload/admin/language/bg-bg/extension/module/probg_blog.php
          php -l upload/admin/language/en-gb/extension/module/probg_blog.php
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.4.0") exit(1);'
          test -f upload/admin/view/javascript/probg_blog_menu_manager.js
          test -f upload/admin/view/stylesheet/probg_blog_menu_manager.css
          grep -q 'probg_blog_menu_manager.js' upload/admin/controller/extension/module/probg_blog.php
          grep -q '## \[1.4.0\]' CHANGELOG.md
      - name: Commit
        run: |
          rm -f tools/apply_1_4_0.py
          rmdir tools 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalize menu manager UI (1.4.0)'
          git push origin HEAD:feat/1.4.0-menu-manager-ui
