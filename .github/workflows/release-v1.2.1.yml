name: Release ProBG Blog v1.2.1

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.head.ref == 'chore/release-v1.2.1-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate source
        run: |
          test -d upload
          test -f install.xml
          grep -q '<version>1.2.1</version>' install.xml
          find upload -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.2.1") { exit(1); }'

      - name: Build OCMOD package
        run: |
          mkdir -p dist
          rm -f dist/probg-blog-1.2.1.ocmod.zip
          zip -qr dist/probg-blog-1.2.1.ocmod.zip install.xml upload
          unzip -t dist/probg-blog-1.2.1.ocmod.zip
          (cd dist && sha256sum probg-blog-*.ocmod.zip > SHA256SUMS)

      - name: Commit release package and remove one-off workflow
        run: |
          rm -f .github/workflows/release-v1.2.1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist .github/workflows/release-v1.2.1.yml
          git commit -m 'release: ProBG Blog 1.2.1'
          git push origin HEAD:main

      - name: Create annotated tag
        run: |
          git tag -a v1.2.1 -m 'ProBG Blog 1.2.1'
          git push origin v1.2.1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.2.1 dist/probg-blog-1.2.1.ocmod.zip \
            --title 'ProBG Blog 1.2.1' \
            --notes $'## Български\n\n**ProBG Blog 1.2.1** коригира критично рекурсивно зареждане при поставяне на модула в OpenCart Layout.\n\n- Коригира `Allowed memory size exhausted` на началната страница и други layout-и.\n- Layout/full-page detection вече е директно в catalog controller source.\n- Добавен е request-level recursion guard.\n- Меню и Последни статии се рендерират като нормални layout блокове без стартиране на пълната blog страница.\n- Премахнат е старият OCMOD workaround за recursion detection.\n\nСлед обновяване изпълнете **Extensions → Modifications → Refresh** и изчистете theme/cache.\n\n## English\n\n**ProBG Blog 1.2.1** fixes critical recursive rendering when the module is assigned to an OpenCart layout.\n\n- Fixes `Allowed memory size exhausted` on the home page and other layouts.\n- Layout/full-page detection now lives directly in the catalog controller source.\n- Added a request-level recursion guard.\n- Menu and Latest Articles render as normal layout blocks without starting the full blog page.\n- Removed the obsolete OCMOD recursion workaround.\n\nAfter updating, run **Extensions → Modifications → Refresh** and clear the theme/cache.'
