name: Release ProBG Blog v1.4.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.4.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate source
        run: |
          set -e
          find upload -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.4.0") { fwrite(STDERR, "install.xml version mismatch\n"); exit(1); }'
          test -f upload/admin/view/javascript/probg_blog_menu_manager.js
          test -f upload/admin/view/stylesheet/probg_blog_menu_manager.css

      - name: Build OCMOD package
        run: |
          set -e
          mkdir -p dist
          rm -f dist/probg-blog-1.4.0.ocmod.zip
          zip -qr dist/probg-blog-1.4.0.ocmod.zip install.xml upload
          unzip -t dist/probg-blog-1.4.0.ocmod.zip >/dev/null
          unzip -Z1 dist/probg-blog-1.4.0.ocmod.zip | grep -qx 'install.xml'
          unzip -Z1 dist/probg-blog-1.4.0.ocmod.zip | grep -q '^upload/'
          (cd dist && sha256sum probg-blog-*.ocmod.zip > SHA256SUMS)

      - name: Commit distribution package
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/probg-blog-1.4.0.ocmod.zip dist/SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m 'release: ProBG Blog 1.4.0'
            git push origin HEAD:main
          fi

      - name: Create annotated tag
        run: |
          set -e
          git tag -a v1.4.0 -m 'ProBG Blog 1.4.0'
          git push origin v1.4.0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.4.0 \
            dist/probg-blog-1.4.0.ocmod.zip \
            dist/SHA256SUMS \
            --title 'ProBG Blog 1.4.0' \
            --notes-file docs/1.4.0.md

      - name: Remove one-off workflow
        run: |
          set -e
          rm -f .github/workflows/release-v1.4.0.yml
          git add .github/workflows/release-v1.4.0.yml
          git commit -m 'chore: remove one-off 1.4.0 release workflow'
          git push origin HEAD:main
