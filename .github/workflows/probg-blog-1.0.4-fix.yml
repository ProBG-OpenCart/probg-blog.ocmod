name: ProBG Blog 1.0.4 Layout Module Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/1.0.4-layout-module-schema'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/1.0.4-layout-module-schema
          fetch-depth: 0

      - name: Apply 1.0.4 migration fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_required(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'Expected at least {minimum} replacements in {path}, found {count}: {old}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Version metadata.
          replace_required('install.xml', '<version>1.0.3</version>', '<version>1.0.4</version>')
          replace_required('upload/admin/controller/extension/module/probg_blog.php', "'1.0.3'", "'1.0.4'", 4)
          replace_required('upload/admin/controller/extension/module/probg_blog.php', "$data['stage'] = '15';", "$data['stage'] = '16';")

          model_path = Path('upload/admin/model/extension/module/probg_blog.php')
          model = model_path.read_text(encoding='utf-8')
          model = model.replace("'module_probg_blog_version'=>'1.0.1'", "'module_probg_blog_version'=>'1.0.4'")
          model = model.replace("        if ($this->config->get('module_probg_blog_version') === '1.0.1') return;\n", '')
          model = model.replace("        $settings['module_probg_blog_version'] = '1.0.1';", "        $settings['module_probg_blog_version'] = '1.0.4';")

          old_cleanup = '''    private function cleanupLegacyLayoutModules() {
        $legacy_codes = array('probg_blog_articles', 'probg_blog_categories');

        foreach ($legacy_codes as $code) {
            $escaped_code = $this->db->escape($code);
            $this->db->query("DELETE FROM `" . DB_PREFIX . "layout_module` WHERE `module` = '" . $escaped_code . "' OR `module` LIKE '" . $escaped_code . ".%'");
            $this->db->query("DELETE FROM `" . DB_PREFIX . "module` WHERE `code` = '" . $escaped_code . "'");
        }
    }
'''
          new_cleanup = '''    private function cleanupLegacyLayoutModules() {
        $legacy_codes = array('probg_blog_articles', 'probg_blog_categories');
        $layout_column = '';

        // Standard OpenCart 3 uses layout_module.code. Some forks may expose
        // the older/non-standard module column, so detect the schema first.
        $code_column = $this->db->query("SHOW COLUMNS FROM `" . DB_PREFIX . "layout_module` LIKE 'code'");
        if ($code_column->num_rows) {
            $layout_column = 'code';
        } else {
            $module_column = $this->db->query("SHOW COLUMNS FROM `" . DB_PREFIX . "layout_module` LIKE 'module'");
            if ($module_column->num_rows) {
                $layout_column = 'module';
            }
        }

        foreach ($legacy_codes as $code) {
            $escaped_code = $this->db->escape($code);

            if ($layout_column !== '') {
                $this->db->query("DELETE FROM `" . DB_PREFIX . "layout_module` WHERE `" . $layout_column . "` = '" . $escaped_code . "' OR `" . $layout_column . "` LIKE '" . $escaped_code . ".%'");
            }

            $this->db->query("DELETE FROM `" . DB_PREFIX . "module` WHERE `code` = '" . $escaped_code . "'");
        }
    }
'''
          if old_cleanup not in model:
              raise SystemExit('Legacy cleanup block not found')
          model = model.replace(old_cleanup, new_cleanup, 1)
          if "module_probg_blog_version'=>'1.0.4'" not in model or "$settings['module_probg_blog_version'] = '1.0.4';" not in model:
              raise SystemExit('Model version normalization failed')
          model_path.write_text(model, encoding='utf-8')

          # Stage messages.
          for path, message in [
              ('upload/admin/language/bg-bg/extension/module/probg_blog.php', 'Версия 1.0.4 коригира migration cleanup-а за стандартната OpenCart 3 колона layout_module.code и прави обновяването идемпотентно.'),
              ('upload/admin/language/en-gb/extension/module/probg_blog.php', 'Version 1.0.4 fixes migration cleanup for the standard OpenCart 3 layout_module.code column and makes upgrades idempotent.')
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text, count = re.subn(r"\$_\['text_stage_info'\]='[^']*';", "$_['text_stage_info']='" + message + "';", text, count=1)
              if count != 1:
                  raise SystemExit(f'text_stage_info not updated in {path}')
              p.write_text(text, encoding='utf-8')

          # Changelog BG/EN.
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''## [1.0.4] - 2026-08-24

### fix — Български

- Коригирана е фаталната SQL грешка `Unknown column 'module' in 'WHERE'` при migration cleanup-а.
- Стандартната OpenCart 3 таблица `layout_module` използва колоната `code`, а не `module`.
- Cleanup логиката вече открива наличната колона чрез `SHOW COLUMNS`, използва `code` при стандартен OpenCart 3 и има безопасен fallback за forks.
- Премахнат е грешният ранен `return` при вътрешна версия `1.0.1`, така че migration-ът е идемпотентен и може безопасно да се изпълни повторно след прекъснат upgrade.
- Вътрешната model версия е синхронизирана с `1.0.4`.

### fix — English

- Fixed the fatal migration SQL error `Unknown column 'module' in 'WHERE'`.
- Standard OpenCart 3 uses the `code` column in the `layout_module` table, not `module`.
- Cleanup now detects the available column with `SHOW COLUMNS`, uses `code` on standard OpenCart 3, and keeps a safe fallback for forks.
- Removed the incorrect early `return` for internal version `1.0.1`, making migrations idempotent and safe to rerun after an interrupted upgrade.
- Synchronized the internal model version with `1.0.4`.

'''
          if '## [1.0.4]' not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(text, encoding='utf-8')

          # README release note.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('- Версия: `1.0.3`', '- Версия: `1.0.4`', 1)
          marker = '`ProBG Blog` е самостоятелен многоезичен блог модул за OpenCart 3 с категории, статии, SEO URL, Open Graph, JSON-LD, sitemap, кеширане, свързани продукти и вградено frontend меню.\n'
          section = '''\n## Промени във версия 1.0.4\n\n- Коригиран е migration cleanup-ът за стандартната OpenCart 3 схема: `layout_module.code`.\n- Отстранена е грешката `Unknown column 'module' in 'WHERE'`.\n- Migration-ът може безопасно да се изпълни отново след прекъснат upgrade.\n\n## Changes in version 1.0.4\n\n- Fixed migration cleanup for the standard OpenCart 3 schema: `layout_module.code`.\n- Fixed `Unknown column 'module' in 'WHERE'`.\n- Migration can safely rerun after an interrupted upgrade.\n'''
          if '## Промени във версия 1.0.4' not in text:
              text = text.replace(marker, marker + section, 1)
          readme.write_text(text, encoding='utf-8')

          stages = Path('docs/STAGES.md')
          text = stages.read_text(encoding='utf-8')
          line = '- 1.0.4 — fixed legacy layout cleanup for OpenCart 3 layout_module.code and made migrations idempotent.\n'
          if line not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += line
          stages.write_text(text, encoding='utf-8')

          Path('docs/1.0.4.md').write_text('''# ProBG Blog 1.0.4\n\n## Български\n\nВерсия 1.0.4 коригира migration cleanup-а на legacy layout модулите. Стандартната OpenCart 3 таблица `layout_module` съдържа колона `code`; използването на несъществуваща `module` причиняваше фатална SQL грешка при отваряне на настройките след upgrade.\n\nCleanup-ът вече проверява схемата и използва правилната колона. Премахнат е и ранният `return` за версия 1.0.1, така че прекъснат migration може безопасно да се стартира отново.\n\n## English\n\nVersion 1.0.4 fixes legacy layout-module migration cleanup. Standard OpenCart 3 stores module identifiers in `layout_module.code`; querying the non-existent `module` column caused a fatal SQL error during upgrade.\n\nCleanup now detects the schema and uses the correct column. The old early return for version 1.0.1 is also removed, so interrupted migrations can safely run again.\n''', encoding='utf-8')

          Path('.trigger-1.0.4').unlink(missing_ok=True)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          find upload -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.0.4") exit(1);'
          grep -q "SHOW COLUMNS FROM.*layout_module.*LIKE 'code'" upload/admin/model/extension/module/probg_blog.php
          grep -q "layout_column" upload/admin/model/extension/module/probg_blog.php
          ! grep -q 'layout_module` WHERE `module`' upload/admin/model/extension/module/probg_blog.php
          ! grep -q "module_probg_blog_version') === '1.0.1'" upload/admin/model/extension/module/probg_blog.php
          grep -q "module_probg_blog_version.*1.0.4" upload/admin/model/extension/module/probg_blog.php

      - name: Commit feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Veselin Totev'
          git config user.email 'v.totev@probg.com'
          git add -A
          git commit -m 'fix: repair OpenCart 3 layout migration (1.0.4)'
          git push origin HEAD:fix/1.0.4-layout-module-schema

      - name: Remove one-off workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup-main origin/main
          git rm .github/workflows/probg-blog-1.0.4-fix.yml
          git commit -m 'chore: remove one-off 1.0.4 workflow'
          git push origin HEAD:main
