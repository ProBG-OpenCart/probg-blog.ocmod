name: Finalize ProBG Blog 1.6.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-probg-blog-1.6.0.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/1.6.0-list-display-category-nav
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply final compatibility fixes
        run: |
          python3 .github/tmp_finalize_probg_blog_1_6_0.py
          rm .github/tmp_finalize_probg_blog_1_6_0.py

      - name: Validate
        run: |
          find upload -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.6.0") { exit(1); }'
          grep -q "\$status !== null" upload/catalog/controller/extension/module/probg_blog.php
          grep -q "category_nav_description_status &&" upload/admin/controller/extension/module/probg_blog.php
          grep -q "module_probg_blog_list_display.*list.*grid" upload/admin/controller/extension/module/probg_blog.php

      - name: Commit feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md upload
          git commit -m 'fix: harden 1.6.0 archive settings compatibility'
          git push origin HEAD:feat/1.6.0-list-display-category-nav

      - name: Remove one-off workflow
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/finalize-probg-blog-1.6.0.yml
          git commit -m 'chore: remove one-off 1.6.0 finalizer workflow'
          git push origin main
