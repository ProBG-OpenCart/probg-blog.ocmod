name: Prepare ProBG Blog 1.7.0 article redesign

on:
  push:
    branches:
      - feat/1.7.0-modern-article-view
    paths:
      - '.github/workflows/prepare-modern-article-1.7.0.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/1.7.0-modern-article-view
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version and documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'install.xml': [('<version>1.6.1</version>', '<version>1.7.0</version>')],
              'upload/admin/controller/extension/module/probg_blog.php': [("'1.6.1'", "'1.7.0'"), ("$data['stage'] = '29';", "$data['stage'] = '30';")],
              'upload/admin/model/extension/module/probg_blog.php': [("'1.6.1'", "'1.7.0'")],
              'README.md': [('**Current version:** `1.6.1`', '**Current version:** `1.7.0`'), ('probg-blog-1.6.1.ocmod.zip', 'probg-blog-1.7.0.ocmod.zip')],
          }

          for filename, rules in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in rules:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if '## [1.7.0]' not in text:
              section = '\n'.join([
                  '## [1.7.0] - 2026-08-30',
                  '',
                  '### feat — Български',
                  '',
                  '- Преработен е изгледът на отделна статия с по-съвременна editorial композиция и по-добра визуална йерархия.',
                  '- Добавени са category pill, по-голямо responsive заглавие и структуриран мета ред с дата на публикуване и редакция.',
                  '- Основното изображение е оформено като голям hero блок с адаптивен размер и по-модерна рамка/сянка.',
                  '- Ширината на основното съдържание е ограничена за по-добра четимост; подобрени са типографията, заглавията, списъците, цитатите, таблиците, линковете и изображенията в текста.',
                  '- Краткото описание е оформено като отделен lead блок.',
                  '- Галерията е обновена с модерни image cards, брояч и по-ясно lightbox действие.',
                  '- Свързаните продукти са преместени в отделен визуален панел с по-съвременни product cards.',
                  '- Новите стилове са изолирани в `probg_blog_article.css` и са scoped само към страницата на статията.',
                  '- Запазена е съвместимостта с OpenCart 3 теми на Bootstrap 3 и Bootstrap 5.',
                  '',
                  '### feat — English',
                  '',
                  '- Redesigned the single article view with a modern editorial composition and stronger visual hierarchy.',
                  '- Added a category pill, larger responsive title, and structured publication/modified metadata row.',
                  '- Restyled the main image as a large responsive hero block.',
                  '- Constrained the reading column and improved typography for headings, paragraphs, lists, quotes, tables, links, and inline images.',
                  '- Restyled the excerpt as a dedicated lead block.',
                  '- Modernized the gallery with image cards, item count, and clearer lightbox affordance.',
                  '- Moved related products into a dedicated visual panel with modern product cards.',
                  '- Isolated the new article styles in `probg_blog_article.css`, scoped only to the article page.',
                  '- Preserved compatibility with OpenCart 3 themes using Bootstrap 3 or Bootstrap 5.',
                  '',
              ])
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + section, 1)
              changelog.write_text(text, encoding='utf-8')

          stages = Path('docs/STAGES.md')
          text = stages.read_text(encoding='utf-8')
          stage_line = '- Stage 30 / 1.7.0 — modernized the single article storefront with editorial typography, constrained reading width, hero media, upgraded gallery and related-product presentation.\n'
          if 'Stage 30 / 1.7.0' not in text:
              text = text.rstrip() + '\n' + stage_line
              stages.write_text(text, encoding='utf-8')

          doc = Path('docs/1.7.0.md')
          doc.write_text('\n'.join([
              '# ProBG Blog 1.7.0',
              '',
              '## Български',
              '',
              'Версия 1.7.0 обновява изгледа на отделната статия с модерна editorial композиция. Заглавието и мета информацията са по-ясно разграничени, основното изображение е оформено като hero блок, а текстовата колона е ограничена за по-добра четимост. Подобрени са стиловете за заглавия, параграфи, списъци, цитати, таблици, линкове и изображения в съдържанието. Галерията и свързаните продукти са визуално обновени и адаптивни.',
              '',
              'Новият stylesheet `probg_blog_article.css` е scoped само към `.probg-blog-article-page`, за да не влияе върху началната страница на блога, категориите, frontend модулите и менютата.',
              '',
              '## English',
              '',
              'Version 1.7.0 redesigns the single article page with a modern editorial layout. The title and metadata have stronger hierarchy, the main image is presented as a hero block, and the reading column is constrained for improved readability. Content typography, gallery presentation, and related products are also modernized and responsive.',
              '',
              'The new `probg_blog_article.css` stylesheet is scoped to `.probg-blog-article-page` so blog archives, modules, and menus remain unaffected.',
              '',
          ]), encoding='utf-8')
          PY

      - name: Validate 1.7.0 source
        shell: bash
        run: |
          set -euo pipefail
          find upload -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.7.0") exit(1);'
          grep -F "version'] = '1.7.0';" upload/admin/controller/extension/module/probg_blog.php
          grep -F "stage'] = '30';" upload/admin/controller/extension/module/probg_blog.php
          grep -F "module_probg_blog_version'] = '1.7.0'" upload/admin/model/extension/module/probg_blog.php
          grep -F '**Current version:** `1.7.0`' README.md
          grep -F '## [1.7.0]' CHANGELOG.md
          grep -F 'Stage 30 / 1.7.0' docs/STAGES.md
          test -f docs/1.7.0.md
          test -f upload/catalog/view/theme/default/stylesheet/probg_blog_article.css
          git diff --check -- ':!README.md'

      - name: Commit 1.7.0 metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.xml README.md CHANGELOG.md docs upload/admin
          git commit -m 'feat: prepare modern article view for 1.7.0'
          git push origin HEAD:feat/1.7.0-modern-article-view

      - name: Remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/prepare-modern-article-1.7.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-off 1.7.0 preparation workflow'
          git push origin HEAD:feat/1.7.0-modern-article-view
