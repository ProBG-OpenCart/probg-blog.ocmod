          s = s.replace("$this->load->model('setting/setting');\n        $this->load->model('extension/module/probg_blog');", "$this->load->model('setting/setting');\n        $this->load->model('setting/module');\n        $this->load->model('extension/module/probg_blog');", 1)

          migration_pattern = re.compile(r"        if \(\$this->config->get\('module_probg_blog_version'\) !== '1\.0\.5'\) \{.*?\n        \}\n\n        if \(\(\$this->request->server\['REQUEST_METHOD'\] === 'POST'\)", re.S)
