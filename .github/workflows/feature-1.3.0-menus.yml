      <div class="form-group"><label class="col-sm-2 control-label">{{ entry_menu_show_categories }}</label><div class="col-sm-10"><select name="probg_blog_menus[__ROW__][show_categories]" class="form-control"><option value="1" selected>{{ text_enabled }}</option><option value="0">{{ text_disabled }}</option></select></div></div>
      <div class="form-group"><label class="col-sm-2 control-label">{{ entry_menu_show_articles }}</label><div class="col-sm-10"><select name="probg_blog_menus[__ROW__][show_articles]" class="form-control"><option value="1" selected>{{ text_enabled }}</option><option value="0">{{ text_disabled }}</option></select></div></div>
      <div class="form-group"><label class="col-sm-2 control-label">{{ entry_menu_category }}</label><div class="col-sm-10"><select name="probg_blog_menus[__ROW__][category_id]" class="form-control"><option value="0">{{ text_all_categories }}</option>{% for category in menu_categories %}<option value="{{ category.category_id }}">{{ category.title }}</option>{% endfor %}</select></div></div>
      <div class="form-group"><label class="col-sm-2 control-label">{{ entry_menu_sort }}</label><div class="col-sm-10"><select name="probg_blog_menus[__ROW__][sort]" class="form-control"><option value="date" selected>{{ text_date }}</option><option value="sort_order">{{ text_sort_order }}</option></select></div></div>
      <div class="form-group"><label class="col-sm-2 control-label">{{ entry_menu_limit }}</label><div class="col-sm-10"><input type="number" min="1" max="100" name="probg_blog_menus[__ROW__][limit]" value="10" class="form-control"></div></div>
      <div class="form-group"><label class="col-sm-2 control-label">{{ entry_menu_display }}</label><div class="col-sm-10"><select name="probg_blog_menus[__ROW__][display]" class="form-control probg-menu-display"><option value="list" selected>{{ text_menu_list }}</option><option value="slider">{{ text_menu_slider }}</option></select></div></div>
      <div class="probg-menu-slider-options" style="display:none">
        <div class="form-group"><label class="col-sm-2 control-label">{{ entry_slider_items }}</label><div class="col-sm-10"><input type="number" min="1" max="6" name="probg_blog_menus[__ROW__][slider_items]" value="3" class="form-control"></div></div>
        <div class="form-group"><label class="col-sm-2 control-label">{{ entry_slider_autoplay }}</label><div class="col-sm-10"><select name="probg_blog_menus[__ROW__][slider_autoplay]" class="form-control"><option value="1" selected>{{ text_enabled }}</option><option value="0">{{ text_disabled }}</option></select></div></div>
        <div class="form-group"><label class="col-sm-2 control-label">{{ entry_slider_interval }}</label><div class="col-sm-10"><input type="number" min="1000" max="30000" step="500" name="probg_blog_menus[__ROW__][slider_interval]" value="5000" class="form-control"></div></div>
      </div>
    </div>
  </div>
</script>
<script>
$('#language a:first').tab('show');
$('.probg-menu-language-tabs').each(function(){ $(this).find('a:first').tab('show'); });
var probgMenuRow = {{ probg_blog_menus|length }};
$('#button-add-probg-menu').on('click', function(){
  var html = $('#probg-blog-menu-template').html().replace(/__ROW__/g, probgMenuRow++);
  var $menu = $(html).appendTo('#probg-blog-menu-editors');
  $menu.find('.probg-menu-language-tabs a:first').tab('show');
});
$(document).on('click', '.button-remove-probg-menu', function(){ $(this).closest('.probg-blog-menu-editor').remove(); });
$(document).on('input', '.probg-blog-menu-name', function(){ $(this).closest('.probg-blog-menu-editor').find('.probg-blog-menu-editor-title').text($(this).val() || 'ProBG Blog Menu'); });
$(document).on('change', '.probg-menu-display', function(){ $(this).closest('.probg-blog-menu-editor').find('.probg-menu-slider-options').toggle($(this).val() === 'slider'); });
</script>'''
          if old_script not in s:
              raise SystemExit('Old admin JS marker not found')
          s = s.replace(old_script, new_script, 1)
          p.write_text(s)

          # ------------------------------------------------------------------
          # OCMOD version; source controller now owns version/stage.
          # ------------------------------------------------------------------
          p = Path('install.xml')
          s = p.read_text()
          s = re.sub(r'<version>[^<]+</version>', '<version>1.3.0</version>', s, count=1)
          s = re.sub(r'\n  <file path="admin/controller/extension/module/probg_blog\.php">.*?</file>\n', '\n', s, count=1, flags=re.S)
          p.write_text(s)

          # ------------------------------------------------------------------
          # Changelog and docs.
          # ------------------------------------------------------------------
          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''# Changelog

## [1.3.0] - 2026-08-25

### fix — Български

- Коригирани са настройките **Покажи линк към блога** и **Покажи категории**, които вече се прилагат от конкретното menu instance.
- Коригиран е филтърът **Категория за статиите**; frontend заявката получава `category_id` директно от избраното меню.

### feat — Български

- Таб **Меню** вече поддържа неограничен брой отделни менюта.
- Всяко меню се записва като стандартен OpenCart `module` instance и се появява независимо в **Design → Layouts**.
- Всяко меню има собствено административно име, многоезично заглавие, статус, show/hide настройки, категория, лимит и подредба.
- Добавен е избор **Списък / Слайдър** за статиите.
- Добавен е собствен responsive article slider без CDN: multi-item desktop, adaptive tablet/mobile, prev/next, dots, autoplay и touch swipe.
- Старата единична menu конфигурация се мигрира автоматично към първото menu instance и съществуващите layout записи в режим Menu се пренасочват към него.

### fix — English

- Fixed **Show blog link** and **Show categories** so each menu instance applies its own values.
- Fixed **Article category** filtering; the storefront query receives `category_id` directly from the selected menu instance.

### feat — English

- The **Menu** tab now supports unlimited independent menus.
- Each menu is stored as a standard OpenCart `module` instance and appears independently in **Design → Layouts**.
- Each menu has its own admin name, multilingual title, status, visibility settings, category, limit and sorting.
- Added **List / Slider** article display modes.
- Added a dependency-free responsive article slider with multi-item desktop layout, adaptive tablet/mobile layout, prev/next controls, dots, autoplay and touch swipe.
- The legacy single-menu configuration is automatically migrated to the first menu instance and existing Menu layout assignments are redirected to it.

'''
          if s.startswith('# Changelog\n'):
              s = entry + s[len('# Changelog\n\n'):]
          else:
              s = entry + s
          p.write_text(s)

          Path('docs/1.3.0.md').write_text('''# ProBG Blog 1.3.0

## Български

Версия 1.3.0 преработва frontend менюто като система от стандартни OpenCart module instances.

### Неограничен брой менюта

В **ProBG Blog → Настройки → Меню** може да се създава неограничен брой менюта. Всяко меню има собствено административно име и се появява като отделна позиция в **Design → Layouts**, например `Blog Sidebar`, `Начална страница — статии`, `Footer Blog`.

### Настройки на всяко меню

- многоезично заглавие;
- статус;
- покажи линк към блога;
- покажи категории;
- покажи статии;
- категория за статиите;
- лимит;
- подредба по дата или sort_order;
- изглед **Списък** или **Слайдър**.

### Slider

Slider режимът е собствен lightweight компонент без външен CDN. Поддържа responsive multi-item изглед, автоматична адаптация за tablet/mobile, prev/next бутони, dots, autoplay, configurable interval, touch swipe и `prefers-reduced-motion`.

### Миграция

При upgrade старата единична menu конфигурация се копира в първото menu instance. Ако старият глобален модул е бил поставен в Layout с output `menu`, записът `probg_blog` се пренасочва към `probg_blog.<module_id>`. Данните на категории и статии не се променят.

## English

Version 1.3.0 converts the frontend menu into standard OpenCart module instances. The Menu tab can create unlimited independent menus, each selectable separately in Design → Layouts. Every menu has its own multilingual title, visibility options, category filter, limit, sorting and List/Slider article display. Legacy menu settings are migrated automatically.
''')

          p = Path('docs/STAGES.md')
          s = p.read_text().rstrip() + "\n- Stage 23 / 1.3.0 — Unlimited OpenCart menu instances, fixed menu toggles/category filter, and responsive list/slider article output.\n"
