        $settings['module_probg_blog_menu_category_id'] = 0;
        $settings['module_probg_blog_menu_limit'] = 10;
        $settings['module_probg_blog_menu_sort'] = 'date';
        $settings['module_probg_blog_version'] = '1.3.0';
