            $this->model_extension_module_probg_blog->migrate();
            $this->ensureLegacyMenuInstance();
            $settings = $this->model_setting_setting->getSetting('module_probg_blog');
            $settings['module_probg_blog_version'] = '1.3.0';
            $this->model_setting_setting->editSetting('module_probg_blog', $settings);
        } else {
            $this->ensureLegacyMenuInstance();
        }

        if (($this->request->server['REQUEST_METHOD'] === 'POST')'''
          s, n = migration_pattern.subn(migration_replacement, s, count=1)
          if n != 1:
              raise SystemExit('Admin migration block not found')

          old_post = '''                unset($description);
            }

            $post['module_probg_blog_version'] = '1.0.5';
            $this->model_setting_setting->editSetting('module_probg_blog', $post);'''
          new_post = '''                unset($description);
            }

            $menus = isset($post['probg_blog_menus']) && is_array($post['probg_blog_menus']) ? $post['probg_blog_menus'] : array();
            unset($post['probg_blog_menus']);
            $menus = $this->syncMenuInstances($menus);
            $this->mirrorLegacyMenuSettings($post, $menus);

            $post['module_probg_blog_version'] = '1.3.0';
            $this->model_setting_setting->editSetting('module_probg_blog', $post);'''
          if old_post not in s:
              raise SystemExit('Admin POST version block not found')
          s = s.replace(old_post, new_post, 1)

          s = s.replace("            'text_layout_articles', 'text_layout_menu', 'text_all_categories',", "            'text_layout_articles', 'text_layout_menu', 'text_all_categories', 'text_menu_list', 'text_menu_slider',", 1)
          s = s.replace("            'entry_menu_show_articles', 'entry_menu_category', 'entry_menu_limit', 'entry_menu_sort',", "            'entry_menu_show_articles', 'entry_menu_category', 'entry_menu_limit', 'entry_menu_sort', 'entry_menu_name', 'entry_menu_status',\n            'entry_menu_display', 'entry_slider_items', 'entry_slider_autoplay', 'entry_slider_interval',", 1)
          s = s.replace("            'help_seo_keyword', 'help_layout_output', 'help_menu_category', 'button_save', 'button_cancel',", "            'help_seo_keyword', 'help_layout_output', 'help_menu_category', 'help_multiple_menus', 'help_slider_items', 'button_save', 'button_cancel',\n            'button_add_menu', 'button_remove_menu',", 1)

          s = s.replace("        $data['error_menu_limit'] = isset($this->error['menu_limit']) ? $this->error['menu_limit'] : '';", "        $data['error_menu_limit'] = isset($this->error['menu_limit']) ? $this->error['menu_limit'] : array();\n        $data['error_menu_name'] = isset($this->error['menu_name']) ? $this->error['menu_name'] : array();\n        $data['error_slider_items'] = isset($this->error['slider_items']) ? $this->error['slider_items'] : array();\n        $data['error_slider_interval'] = isset($this->error['slider_interval']) ? $this->error['slider_interval'] : array();", 1)
          s = s.replace("        $data['error_menu_title'] = isset($this->error['menu_title']) ? $this->error['menu_title'] : array();", "        $data['error_menu_title'] = isset($this->error['menu_title']) ? $this->error['menu_title'] : array();", 1)
          s = s.replace("        $data['stage'] = '17';\n        $data['version'] = '1.0.5';", "        $data['stage'] = '23';\n        $data['version'] = '1.3.0';", 1)

          menu_desc_pattern = re.compile(r"\n        if \(isset\(\$this->request->post\['module_probg_blog_menu_description'\]\)\) \{.*?\n        \$data\['module_probg_blog_menu_description'\] = \$menu_descriptions;\n", re.S)
          s, n = menu_desc_pattern.subn('\n', s, count=1)
          if n != 1:
              raise SystemExit('Legacy menu description data block not found')

          marker = "        $data['menu_categories'] = $this->model_extension_probg_blog_category->getCategories(array('sort' => 'cd.title', 'order' => 'ASC'));"
          insert = marker + '''

        $menu_rows = isset($this->request->post['probg_blog_menus']) && is_array($this->request->post['probg_blog_menus'])
            ? $this->request->post['probg_blog_menus']
            : $this->getMenuInstances();
        $data['probg_blog_menus'] = array();
        foreach ($menu_rows as $row => $menu) {
            $module_id = isset($menu['module_id']) ? (int)$menu['module_id'] : 0;
            $data['probg_blog_menus'][] = $this->normalizeMenu($menu, $module_id);
        }'''
          if marker not in s:
              raise SystemExit('menu_categories marker not found')
          s = s.replace(marker, insert, 1)

          install_pattern = re.compile(r"    public function install\(\) \{.*?\n    \}\n\n    private function grantPermissions", re.S)
          install_replacement = '''    public function install() {
        $this->load->model('extension/module/probg_blog');
        $this->model_extension_module_probg_blog->install();
