name: Build ProBG Blog 1.3.0 multiple menus

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'feat/1.3.0-multiple-menus-slider'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/1.3.0-multiple-menus-slider
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Implement 1.3.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

