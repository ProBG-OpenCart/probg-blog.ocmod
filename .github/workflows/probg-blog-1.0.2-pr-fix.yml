name: ProBG Blog 1.0.2 PR Fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.0.2-admin-permissions-design
          fetch-depth: 0

      - name: Apply 1.0.2 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('install.xml', '<version>1.0.1</version>', '<version>1.0.2</version>')

          p = Path('upload/admin/controller/extension/module/probg_blog.php')
          text = p.read_text(encoding='utf-8')
          text = text.replace("'1.0.1'", "'1.0.2'")
          text = text.replace("$data['stage'] = '13';", "$data['stage'] = '14';")
          needle = "        $this->load->model('extension/probg_blog/article');\n"
          inject = needle + "\n        // Existing installations may not have permissions for the integrated CRUD routes.\n        // Only a group that can already modify ProBG Blog is allowed to receive them.\n        if ($this->user->hasPermission('modify', 'extension/module/probg_blog')) {\n            $this->grantPermissions();\n        }\n"
          if inject not in text:
              if needle not in text:
                  raise SystemExit('Article model load anchor not found')
              text = text.replace(needle, inject, 1)

          old_permissions = "        $this->load->model('user/user_group');\n        $group_id = $this->user->getGroupId();\n        $routes = array('extension/module/probg_blog','extension/probg_blog/category','extension/probg_blog/article');\n        foreach ($routes as $route) {\n            $this->model_user_user_group->addPermission($group_id, 'access', $route);\n            $this->model_user_user_group->addPermission($group_id, 'modify', $route);\n        }\n"
          if old_permissions in text:
              text = text.replace(old_permissions, "        $this->grantPermissions();\n", 1)

          helper_anchor = "    public function uninstall() {\n"
          helper = "    private function grantPermissions() {\n        $this->load->model('user/user_group');\n\n        $group_id = $this->user->getGroupId();\n        $routes = array(\n            'extension/module/probg_blog',\n            'extension/probg_blog/category',\n            'extension/probg_blog/article'\n        );\n\n        foreach ($routes as $route) {\n            $this->model_user_user_group->addPermission($group_id, 'access', $route);\n            $this->model_user_user_group->addPermission($group_id, 'modify', $route);\n        }\n    }\n\n"
          if helper not in text:
              if helper_anchor not in text:
                  raise SystemExit('Uninstall anchor not found')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('upload/admin/model/extension/module/probg_blog.php')
          p.write_text(p.read_text(encoding='utf-8').replace("'1.0.1'", "'1.0.2'"), encoding='utf-8')

          p = Path('upload/admin/view/template/extension/module/probg_blog.twig')
          text = p.read_text(encoding='utf-8')
          old = '''    <div class="row"><div class="col-sm-6"><div class="tile"><div class="tile-heading">{{ text_categories }}</div><div class="tile-body"><i class="fa fa-folder-open"></i><h2 class="pull-right">{{ total_categories }}</h2></div><div class="tile-footer"><a href="{{ categories_url }}">{{ button_categories }}</a></div></div></div><div class="col-sm-6"><div class="tile"><div class="tile-heading">{{ text_articles }}</div><div class="tile-body"><i class="fa fa-file-text-o"></i><h2 class="pull-right">{{ total_articles }}</h2></div><div class="tile-footer"><a href="{{ articles_url }}">{{ button_articles }}</a></div></div></div></div>'''
          new = '''    <div class="row">
      <div class="col-sm-6">
        <div class="panel panel-default">
          <div class="panel-heading"><h3 class="panel-title"><i class="fa fa-folder-open"></i> {{ text_categories }}</h3></div>
          <div class="panel-body clearfix">
            <a href="{{ categories_url }}" class="btn btn-primary pull-left"><i class="fa fa-list"></i> {{ button_categories }}</a>
            <strong class="pull-right" style="font-size:28px;line-height:34px;">{{ total_categories }}</strong>
          </div>
        </div>
      </div>
      <div class="col-sm-6">
        <div class="panel panel-default">
          <div class="panel-heading"><h3 class="panel-title"><i class="fa fa-file-text-o"></i> {{ text_articles }}</h3></div>
          <div class="panel-body clearfix">
            <a href="{{ articles_url }}" class="btn btn-primary pull-left"><i class="fa fa-list"></i> {{ button_articles }}</a>
            <strong class="pull-right" style="font-size:28px;line-height:34px;">{{ total_articles }}</strong>
          </div>
        </div>
      </div>
    </div>'''
          if old not in text:
              raise SystemExit('Legacy tile row not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          bg = Path('upload/admin/language/bg-bg/extension/module/probg_blog.php')
          text = bg.read_text(encoding='utf-8')
          text = re.sub(r"\$_\['text_stage_info'\]='[^']*';", "$_['text_stage_info']='Версия 1.0.2 коригира правата за достъп до Категории и Статии при обновяване и подобрява административния обзор.';", text, count=1)
          bg.write_text(text, encoding='utf-8')

          en = Path('upload/admin/language/en-gb/extension/module/probg_blog.php')
          text = en.read_text(encoding='utf-8')
          text = re.sub(r"\$_\['text_stage_info'\]='[^']*';", "$_['text_stage_info']='Version 1.0.2 fixes Categories and Articles permissions on upgrade and improves the administration overview.';", text, count=1)
          en.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('- Версия: `1.0.1`', '- Версия: `1.0.2`', 1)
          marker = '`ProBG Blog` е самостоятелен многоезичен блог модул за OpenCart 3 с категории, статии, SEO URL, Open Graph, JSON-LD, sitemap, кеширане, свързани продукти и вградено frontend меню.\n'
          section = '''\n## Промени във версия 1.0.2\n\n- Коригирани са access/modify правата за интегрираните табове **Категории** и **Статии** при обновяване на вече инсталиран модул.\n- Правата се добавят само за потребителска група, която вече има право да променя основния **ProBG Blog** модул.\n- Административният обзор е преработен със стандартни OpenCart панели вместо несъвместимите dashboard `tile` компоненти.\n- Броят категории и статии остава видим, с директни бутони към съответните списъци.\n\n## Changes in version 1.0.2\n\n- Fixed access/modify permissions for the integrated **Categories** and **Articles** tabs when upgrading an existing installation.\n- Permissions are granted only to a user group that already has modify permission for the main **ProBG Blog** module.\n- Reworked the administration overview using standard OpenCart panels instead of incompatible dashboard `tile` components.\n- Category and article totals remain visible with direct buttons to their lists.\n'''
          if '## Промени във версия 1.0.2' not in text:
              text = text.replace(marker, marker + section, 1)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''## [1.0.2] - 2026-08-24\n\n### fix — Български\n\n- Коригирано е наследяването на access/modify permissions за `extension/probg_blog/category` и `extension/probg_blog/article` при обновяване.\n- Добавено е безопасно предоставяне на CRUD правата само когато текущата група вече има `modify` право за `extension/module/probg_blog`.\n- Заменени са dashboard `tile` блоковете със стандартни OpenCart `panel panel-default` компоненти за правилен контраст във всички admin теми.\n- Вътрешната версия и OCMOD версията са обновени до `1.0.2`.\n\n### fix — English\n\n- Fixed access/modify permission inheritance for `extension/probg_blog/category` and `extension/probg_blog/article` on upgrade.\n- Added safe CRUD permission provisioning only when the current group already has `modify` permission for `extension/module/probg_blog`.\n- Replaced dashboard `tile` blocks with standard OpenCart `panel panel-default` components for consistent contrast across admin themes.\n- Updated the internal and OCMOD versions to `1.0.2`.\n\n'''
          if '## [1.0.2]' not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(text, encoding='utf-8')

          stages = Path('docs/STAGES.md')
          text = stages.read_text(encoding='utf-8')
          line = '- 1.0.2 — admin permission migration for Categories/Articles and standard OpenCart overview panels.\n'
          if line not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += line
          stages.write_text(text, encoding='utf-8')
          PY

      - name: Validate and build package
        shell: bash
        run: |
          set -euo pipefail
          find upload -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.0.2") exit(1);'
          grep -q "grantPermissions" upload/admin/controller/extension/module/probg_blog.php
          ! grep -q 'class="tile"' upload/admin/view/template/extension/module/probg_blog.twig
          rm -f dist/probg-blog-1.0.2.ocmod.zip
          zip -rq dist/probg-blog-1.0.2.ocmod.zip install.xml upload
          unzip -t dist/probg-blog-1.0.2.ocmod.zip >/dev/null
          (cd dist && sha256sum probg-blog-*.ocmod.zip > SHA256SUMS)

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Veselin Totev'
          git config user.email 'v.totev@probg.com'
          git add install.xml README.md CHANGELOG.md docs/STAGES.md upload dist
          git commit -m 'fix: admin permissions and overview design (1.0.2)'
          git push origin HEAD:fix/1.0.2-admin-permissions-design

      - name: Remove one-off workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/probg-blog-1.0.2-fix.yml .github/workflows/probg-blog-1.0.2-pr-fix.yml
          git commit -m 'chore: remove one-off 1.0.2 workflows'
          git push origin HEAD:fix/1.0.2-admin-permissions-design
