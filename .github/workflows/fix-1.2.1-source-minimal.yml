name: Apply ProBG Blog 1.2.1 source fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.2.1-layout-recursion-source
          fetch-depth: 0

      - name: Patch controller source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('upload/catalog/controller/extension/module/probg_blog.php')
          s = p.read_text()
          pat = re.compile(r"class ControllerExtensionModuleProbgBlog extends Controller \{\n    public function index\(\$setting=array\(\)\) \{.*?\n    \}\n\n    private function listing\(\)", re.S)
          rep = '''class ControllerExtensionModuleProbgBlog extends Controller {
              private static $full_page_rendering = false;

              public function index($setting=array()) {
                  if (!$this->config->get('module_probg_blog_status')) return '';
                  $this->load->language('extension/module/probg_blog');
                  $this->load->model('extension/probg_blog/blog');
                  $this->load->model('tool/image');

                  $category_id = isset($this->request->get['probg_blog_category_id']) ? (int)$this->request->get['probg_blog_category_id'] : 0;
                  $article_id = isset($this->request->get['probg_blog_article_id']) ? (int)$this->request->get['probg_blog_article_id'] : 0;
                  $route = isset($this->request->get['route']) ? (string)$this->request->get['route'] : '';
                  $is_blog_request = ($route === 'extension/module/probg_blog' || $category_id > 0 || $article_id > 0);

                  if (!$is_blog_request || self::$full_page_rendering) {
                      return $this->module(is_array($setting) ? $setting : array());
                  }

                  self::$full_page_rendering = true;

                  if ($article_id) {
                      $output = $this->article($article_id, $category_id);
                  } elseif ($category_id) {
                      $output = $this->category($category_id);
                  } else {
                      $output = $this->listing();
                  }

                  self::$full_page_rendering = false;
                  return $output;
              }

              private function listing()'''
          s, n = pat.subn(rep, s, count=1)
          if n != 1:
              raise SystemExit('index() source block not found')
          # Restore the project's four-space class indentation after the replacement.
          lines = s.splitlines()
          for i, line in enumerate(lines):
              if 2 <= i <= 37 and line.startswith('            '):
                  lines[i] = line[8:]
          p.write_text('\n'.join(lines) + '\n')
          PY

      - name: Validate PHP
        run: |
          php -l upload/catalog/controller/extension/module/probg_blog.php
          grep -q 'private static $full_page_rendering = false;' upload/catalog/controller/extension/module/probg_blog.php
          grep -q '!$is_blog_request || self::$full_page_rendering' upload/catalog/controller/extension/module/probg_blog.php

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/catalog/controller/extension/module/probg_blog.php
          git commit -m 'fix: enforce layout recursion guard in catalog source' || exit 0
          git push origin HEAD:fix/1.2.1-layout-recursion-source
