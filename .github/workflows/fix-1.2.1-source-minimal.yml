name: Complete ProBG Blog 1.2.1 docs

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.2.1-layout-recursion-source
          fetch-depth: 0

      - name: Update changelog and admin stage text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          bg = Path('upload/admin/language/bg-bg/extension/module/probg_blog.php')
          t = bg.read_text()
          t = re.sub(r"\$_\['text_stage_info'\]='[^']*';", "$_['text_stage_info']='Версия 1.2.1 коригира рекурсивното зареждане и memory exhaustion при добавяне на ProBG Blog в OpenCart layout, включително на началната страница.';", t, count=1)
          bg.write_text(t)

          en = Path('upload/admin/language/en-gb/extension/module/probg_blog.php')
          t = en.read_text()
          t = re.sub(r"\$_\['text_stage_info'\]='[^']*';", "$_['text_stage_info']='Version 1.2.1 fixes recursive rendering and memory exhaustion when ProBG Blog is assigned to an OpenCart layout, including the home page.';", t, count=1)
          en.write_text(t)

          c = Path('CHANGELOG.md')
          t = c.read_text()
          if '## [1.2.1]' not in t:
              entry = '''## [1.2.1] - 2026-08-25

### fix — Български

- Коригирано е критично рекурсивно зареждане при добавяне на ProBG Blog **Меню** или **Последни статии** в `Design → Layouts`, включително на началната страница.
- Коригиран е PHP `Allowed memory size exhausted`, причинен от стария `$setting`-базиран source controller flow.
- Layout/full-page detection вече е директно в catalog controller source.
- Добавен е static request-level recursion guard преди зареждане на layout позициите.
- Старият OCMOD workaround за recursion detection е премахнат.

### fix — English

- Fixed critical recursive rendering when ProBG Blog **Menu** or **Latest Articles** is assigned in `Design → Layouts`, including the home page.
- Fixed PHP `Allowed memory size exhausted` caused by the legacy `$setting`-based source controller flow.
- Layout/full-page detection now lives directly in the catalog controller source.
- Added a static request-level recursion guard before layout positions are loaded.
- Removed the obsolete OCMOD recursion-detection workaround.

'''
              c.write_text('# Changelog\n\n' + entry + t[len('# Changelog\n\n'):])
          PY

          grep -q '## \[1.2.1\]' CHANGELOG.md
          grep -q 'Version 1.2.1' upload/admin/language/en-gb/extension/module/probg_blog.php

      - name: Commit docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md upload/admin/language/bg-bg/extension/module/probg_blog.php upload/admin/language/en-gb/extension/module/probg_blog.php
          git commit -m 'docs: document ProBG Blog 1.2.1 recursion fix'
          git push origin HEAD:fix/1.2.1-layout-recursion-source
