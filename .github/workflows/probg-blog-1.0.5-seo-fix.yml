name: ProBG Blog 1.0.5 SEO Route Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/1.0.5-seo-route-rewrite'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/1.0.5-seo-route-rewrite
          fetch-depth: 0

      - name: Apply 1.0.5 SEO rewrite fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          install = Path('install.xml')
          text = install.read_text(encoding='utf-8')
          text = text.replace('<version>1.0.4</version>', '<version>1.0.5</version>', 1)

          old = '''                if ($data['route'] == 'extension/module/probg_blog' && ($key == 'route' || $key == 'probg_blog_category_id' || $key == 'probg_blog_article_id')) {
                    $probg_blog_query = ($key == 'route') ? $value : $key . '=' . (int)$value;
                    $probg_blog_seo = $this->db->query("SELECT * FROM " . DB_PREFIX . "seo_url WHERE `query` = '" . $this->db->escape($probg_blog_query) . "' AND store_id = '" . (int)$this->config->get('config_store_id') . "' AND language_id = '" . (int)$this->config->get('config_language_id') . "'");
                    if ($probg_blog_seo->num_rows && $probg_blog_seo->row['keyword']) { $url .= '/' . $probg_blog_seo->row['keyword']; unset($data[$key]); }
                }
'''
          new = '''                if (isset($data['route']) && $data['route'] == 'extension/module/probg_blog' && ($key == 'route' || $key == 'probg_blog_category_id' || $key == 'probg_blog_article_id')) {
                    $probg_blog_query = ($key == 'route') ? $value : $key . '=' . (int)$value;
                    $probg_blog_seo = $this->db->query("SELECT * FROM " . DB_PREFIX . "seo_url WHERE `query` = '" . $this->db->escape($probg_blog_query) . "' AND store_id = '" . (int)$this->config->get('config_store_id') . "' AND language_id = '" . (int)$this->config->get('config_language_id') . "'");
                    if ($probg_blog_seo->num_rows && $probg_blog_seo->row['keyword']) {
                        $url .= '/' . $probg_blog_seo->row['keyword'];
                        if ($key != 'route') {
                            unset($data[$key]);
                        }
                    }
                }
'''
          if old not in text:
              raise SystemExit('Expected ProBG Blog rewrite block not found')
          install.write_text(text.replace(old, new, 1), encoding='utf-8')

          controller = Path('upload/admin/controller/extension/module/probg_blog.php')
          text = controller.read_text(encoding='utf-8')
          count = text.count("'1.0.4'")
          if count < 4:
              raise SystemExit(f'Expected >=4 version markers in controller, found {count}')
          text = text.replace("'1.0.4'", "'1.0.5'")
          text = text.replace("$data['stage'] = '16';", "$data['stage'] = '17';", 1)
          controller.write_text(text, encoding='utf-8')

          model = Path('upload/admin/model/extension/module/probg_blog.php')
          text = model.read_text(encoding='utf-8')
          text = text.replace("'module_probg_blog_version'=>'1.0.4'", "'module_probg_blog_version'=>'1.0.5'")
          text = text.replace("$settings['module_probg_blog_version'] = '1.0.4';", "$settings['module_probg_blog_version'] = '1.0.5';")
          model.write_text(text, encoding='utf-8')

          for path, msg in [
              ('upload/admin/language/bg-bg/extension/module/probg_blog.php', "Версия 1.0.5 коригира frontend SEO rewrite Notice за липсващ route при преглед на блог статии."),
              ('upload/admin/language/en-gb/extension/module/probg_blog.php', "Version 1.0.5 fixes the frontend SEO rewrite Notice caused by an unset route while viewing blog articles.")
          ]:
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              t, n = re.subn(r"\$_\['text_stage_info'\]='[^']*';", "$_['text_stage_info']='" + msg + "';", t, count=1)
              if n != 1:
                  raise SystemExit(f'Could not update stage info in {path}')
              p.write_text(t, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          t = changelog.read_text(encoding='utf-8')
          entry = '''## [1.0.5] - 2026-08-24

### fix — Български

- Коригиран е frontend Notice `Undefined index: route` в модифицирания `catalog/controller/startup/seo_url.php` при преглед на блог статия.
- ProBG Blog SEO rewrite вече не премахва `$data['route']` по време на текущата итерация на стандартния OpenCart rewrite цикъл.
- `route` се оставя на стандартния OpenCart код да бъде почистен в края на rewrite обработката.
- Премахват се само `probg_blog_category_id` и `probg_blog_article_id` след успешно преобразуване в SEO сегменти.
- Добавена е допълнителна `isset($data['route'])` защита.
- Запазена е йерархичната URL структура `/blog/category/article`.

### fix — English

- Fixed frontend Notice `Undefined index: route` in the modified `catalog/controller/startup/seo_url.php` while viewing a blog article.
- ProBG Blog SEO rewrite no longer removes `$data['route']` during the current iteration of OpenCart's standard rewrite loop.
- The standard OpenCart code is allowed to remove `route` at the end of rewrite processing.
- Only `probg_blog_category_id` and `probg_blog_article_id` are removed after successful SEO segment generation.
- Added an extra `isset($data['route'])` guard.
- Preserved the hierarchical `/blog/category/article` URL structure.

'''
          if '## [1.0.5]' not in t:
              t = t.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(t, encoding='utf-8')

          stages = Path('docs/STAGES.md')
          t = stages.read_text(encoding='utf-8')
          line = '- 1.0.5 — fixed frontend SEO rewrite route lifetime and preserved hierarchical blog URLs.\n'
          if line not in t:
              if not t.endswith('\n'):
                  t += '\n'
              t += line
          stages.write_text(t, encoding='utf-8')

          Path('docs/1.0.5.md').write_text('''# ProBG Blog 1.0.5\n\n## Български\n\nВерсия 1.0.5 коригира `Undefined index: route` Notice при преглед на блог статия във frontend. Причината беше, че OCMOD SEO rewrite логиката премахваше `$data['route']` веднага след генерирането на blog SEO сегмента, а стандартният OpenCart код продължаваше да използва същия ключ в текущата итерация.\n\n`route` вече остава наличен до края на стандартната OpenCart rewrite обработка. След успешно SEO преобразуване се премахват само `probg_blog_category_id` и `probg_blog_article_id`. URL структурата `/blog/category/article` се запазва.\n\n## English\n\nVersion 1.0.5 fixes the `Undefined index: route` Notice while viewing blog articles on the storefront. The OCMOD SEO rewrite previously removed `$data['route']` immediately after generating the blog SEO segment, while OpenCart's standard rewrite logic still referenced the same key during that iteration.\n\n`route` now remains available until standard OpenCart rewrite processing finishes. Only `probg_blog_category_id` and `probg_blog_article_id` are removed after successful SEO conversion. The `/blog/category/article` URL hierarchy is preserved.\n''', encoding='utf-8')

          Path('.trigger-1.0.5').unlink(missing_ok=True)
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          find upload -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$x=simplexml_load_file("install.xml"); if (!$x || (string)$x->version !== "1.0.5") exit(1);'
          grep -q "isset(\$data\['route'\]) && \$data\['route'\] == 'extension/module/probg_blog'" install.xml
          grep -q "if (\$key != 'route')" install.xml
          ! grep -q "keyword.*unset(\$data\[\$key\])" install.xml

      - name: Commit feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Veselin Totev'
          git config user.email 'v.totev@probg.com'
          git add -A
          git commit -m 'fix: preserve route during blog SEO rewrite (1.0.5)'
          git push origin HEAD:fix/1.0.5-seo-route-rewrite

      - name: Remove one-off workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup-main origin/main
          git rm .github/workflows/probg-blog-1.0.5-seo-fix.yml
          git commit -m 'chore: remove one-off 1.0.5 workflow'
          git push origin HEAD:main
